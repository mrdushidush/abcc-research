schema = 1
id     = "u100"
title  = "ABCC's 100-task suite — the 90 stable tasks"

# The tree currently holds ONE task, the worked example from SPEC.md §15. Step 2 of the W8
# plan emits the other 89. The counts and the aggregate rule below describe the full import
# so the importer has something to be checked against.

[provenance]
donor        = "agent-battle-command-center"
donor_commit = "d5528ea"
donor_path   = "scripts/ultimate-100-task-test.js"
imported_at  = "2026-08-08"

# The pool is 90, not 100. The last 10 slots are a CTO-decomposition experiment whose task
# content changed between the only two runs it appeared in (weather, then recipe), so there
# is nothing stable to import. F11.
expected_tasks = 90

caveats = [
  """
  the donor shared one cumulative workspace across all 100 tasks \
  (ultimate-100-task-test.js:2642-2653); RESET_EVERY_N_TASKS resets agent memory, not the \
  filesystem. Per-task isolation here is better science and breaks byte-comparability with \
  the 7 recorded runs. F7\
  """,

  """
  the donor had no permission gate anywhere in the path, so every U100 baseline is \
  effectively mode=allow and is comparable to the `control` variant and to nothing else. F1\
  """,

  """
  section 2 (15 `landing` tasks) is unverifiable by construction: its verifiers string-match \
  generated marketing pages, so a PASS establishes presence and not correctness. All 24 \
  string-match verifiers in the suite were measured passing a file whose entire content is a \
  comment holding the searched substrings. They carry verifiable = presence_only and ARE \
  included in aggregates, per David 2026-08-08; the alternative was quarantining them, which \
  would have taken the usable suite from 90 to 54 and dropped all 15. F20, R9\
  """,

  """
  36 of the 90 are demonstrated not to reject at least one wrong answer: 10 with no verifier, \
  1 passing its own unfixed fixture, 1 passing an intact vulnerability, 24 passing an empty \
  page. The remaining 54 are step-1 sound with no step-3 evidence either way\
  """,

  """
  every gate result recorded in this suite was measured on the Windows host (Python 3.14.5, \
  Node 24.15.0), not inside the abcc-agents container. A Linux re-run is unspent; the \
  absent/stub error-class transition is the thing to check if it ever disagrees\
  """,

  """
  `fetch failed` means two opposite things in the donor's recorded data — 2 s in the collapse \
  run (endpoint down) and 307 s in the clean runs (the 300 s task timeout). Exclude the \
  collapse run by run id, never by error string. F12\
  """,

  # ---------------------------------------------------------------------------
  # Added by the import itself (harness/crates/w8-import, 2026-08-08). Everything
  # below was measured while building the importer, not predicted before it.
  # ---------------------------------------------------------------------------

  """
  ALL 90 prompts name ABCC's `file_write` tool, which Claudette does not have. Every one is \
  rewritten to `write_file` (tools/file_ops.rs:65), the same contract; the ten `fix_*` prompts \
  end by asking for the fixed file to be *saved*, and take 'Edit the file to fix it.' instead. \
  This is a semantic edit to a donor prompt on every task in the suite, and it is the largest \
  single threat to comparability in the whole import\
  """,

  """
  PATHS are flattened from `tasks/<dir>/<file>` to the basename, relative to the work dir. \
  Safe as a blanket rule and checked before adopting it: all 107 donor paths sit at exactly one \
  directory of depth, every task dictates exactly one artifact, and flattening the basenames \
  collides in ZERO of the 90 tasks\
  """,

  """
  `lang` is the ARTIFACT's language, taken from its file extension — not the donor's \
  `validationLang`, which describes the verifier. 25 tasks produce html/css/jsx while their \
  verifier is python, so reading validationLang would have labelled all of section 2 `python`. \
  `.css` maps to `html` because SPEC §3's vocabulary has no `css` and a stylesheet is a \
  web-page asset\
  """,

  """
  THE DONOR SOURCE IS ENTIRELY CRLF — 3,521 \\r\\n and zero bare \\n. Normalised to LF at read. \
  Not cosmetic: anything anchored on \\n silently misses, which first emptied the reconstructed \
  dependency fixtures below and made two tasks' gate point 1 read `sound` while measuring \
  nothing at all\
  """,

  """
  FOUR tasks reach a module that a DIFFERENT donor task was supposed to create, because the \
  donor shared one cumulative workspace (F7): py_todo_handlers, node_note_handlers, \
  py_server_main and node_server_main. Under per-task isolation those modules are absent, the \
  verifier raises before any assertion, and the task scores FAIL regardless of the subject's \
  work — a FAIL indistinguishable from a sound verifier rejecting a wrong answer. Each is \
  reconstructed into fixture/ from the sibling task's prompt, which dictates its whole body \
  verbatim. py_server_main's four dependencies appear nowhere in its verifier; its own dictated \
  body imports them, and only the positive control surfaced that\
  """,

  """
  py_server_main's dictated body uses RELATIVE imports (`from .router import`), which need a \
  package that the flattened work dir is not. Rewritten to absolute in the prompt — a \
  mechanical consequence of the flatten decision rather than a separate one\
  """,

  """
  FOUR donor prompts dictate content whose backslashes JS template-literal processing has \
  ALREADY eaten, so the agent never sees them: sec_input_validator (\\.), sec_xss_filter \
  (\\s \\S \\w \\/), go_slug (\\s) and mini_markdown (\\* \\[ \\] \\( \\)). Verified by running \
  node, not by reading the spec: `[\\s\\S]` in a template literal evaluates to `[sS]`. For \
  sec_xss_filter this is FATAL — the dictated regex becomes `/<script[^>]*>[sS]*?</script>/gi`, \
  a JavaScript syntax error, so following the donor's own prompt literally cannot pass the \
  donor's own verifier. Left UNREPAIRED: the 7 recorded runs used the corrupted prompt, and \
  repairing it would change the task's difficulty while claiming to be an import\
  """,

  """
  POSITIVE CONTROL, without which none of the gate results mean anything: every gate tier \
  expects FAIL, so a verify.sh incapable of ever printing PASS would score as 80 sound \
  verifiers. 50 of the 90 donor prompts dictate the artifact body verbatim, which is a \
  reference solution by construction. 49 of those 50 PASS their own verifier; the one that does \
  not is sec_xss_filter, above. So a FAIL at a gate tier is attributable to the tier and not to \
  the import\
  """,

  """
  78 of the 90 tasks generate their artifact from nothing and so have an EMPTY fixture/, \
  holding only a .gitkeep because git cannot carry an empty directory. The runner must not copy \
  dotfiles into the work dir\
  """,

  """
  `donor_tags.section` carries the donor's raw value. The research docs' 4A/4B split (10 `sec_*` \
  authored vs 10 `fix_*` repair tasks) is a human refinement that exists nowhere in the donor, \
  which records both as section 4. The hand-authored fix_sql_inject task.toml says "4B" and the \
  importer says "4" for that reason\
  """,
]

[aggregate]
# Which dispositions enter a headline number. Set by David 2026-08-08. Flipping these
# re-scores without re-importing — that is what carrying disposition as a field buys.
# Any published number must state the rule it was computed under.
include_verifiable  = ["full", "presence_only"]
exclude_quarantined = true

# Retry-once-on-timeout is deliberately absent. The donor battery retried on exit 124 because
# "the first attempt warms the model"; the warmup turn required by RUNMETA removes the cause,
# and a retry would otherwise hide a real timeout as difficulty signal. F10, F12.
retry_on_timeout = false

# ---------------------------------------------------------------------------
# Default variants, inherited by every task in the suite. A task overrides one
# by declaring the same `id` in its own variants.toml. SPEC.md §5.
# ---------------------------------------------------------------------------

# Donor-faithful. The 7 recorded runs are baselines for this variant only.
[[variant]]
id          = "control"
permissions = { mode = "allow" }
operator    = []

# Measures what the gate costs when the operator always says yes: the same work, plus
# whatever the round trip does to latency and iteration count.
[[variant]]
id          = "gated"
permissions = { mode = "workspace_write" }
requires    = ["tool_gate"]
expect      = { gate_fires = { min = 1 } }
default     = "deny"
operator    = [ { on = { gate = {} }, do = "approve" } ]

# The generic redirect. Tasks that can say something more specific override this by id;
# `fix_sql_inject` does.
[[variant]]
id          = "redirect-first-edit"
permissions = { mode = "workspace_write" }
requires    = ["tool_gate", "redirect"]
expect      = { gate_fires = { min = 1 }, interventions_delivered = 1 }
default     = "deny"

[[variant.operator]]
on    = { gate = {} }
do    = { redirect = "Before editing, say in one sentence which file you are about to change and why." }
times = 1

[[variant.operator]]
on = { gate = {} }
do = "approve"
