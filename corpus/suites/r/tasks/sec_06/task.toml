schema    = 1
id        = "sec_06"
title     = "semantic_grep deliberately re-admits .env, so credentials reach model context"
lang      = "rust"
kind      = "security"
# The H1 attempts on SEC-06 took 191-286 s; the budget is the whole `abcc run` or REPL session,
# including the subject's own builds of claudette.
timeout_s = 1800

[fixture]
kind = "git_archive"
repo = "D:/dev/claudette"
rev  = "3fdfefe12289b63b42e0502f516d41a1f8c59eed"   # the parent of RUNTIME-11b's landing; every R card is open here

[[turn]]
send_file = "prompt.txt"

[verify]
kind   = "script"
script = "verify.sh"

[disposition]
verifiable = "full"
quarantine = "none"
reason = """
the card author's red test runs as a hidden module the subject never sees, beside the whole claudette \
lib suite, fmt and clippy -D warnings; a PASS is the defect fixed, nothing regressed, and the tree \
landable\
"""

[gate]
point1 = "sound"
point2 = "sound"
point3 = "not_run"   # no sham authored yet

[[gate.evidence]]
point    = 1
tier     = "donor_fixture"
verdict  = "FAIL"
detail   = "the pinned base, untouched: hidden test red: walk_skips_dotenv_like_every_other_dotfile; others, fmt, clippy pass"
verifier = "rewritten"
run      = "corpus/suites/r/lib/gate.sh, Windows host, 2026-09-23"

[[gate.evidence]]
point    = 2
tier     = "refsol"
verdict  = "PASS"
detail   = "base + refsol/fix.patch: behaviour, others, fmt, clippy all pass (after the fmt-only refsol rewrite)"
verifier = "rewritten"
run      = "corpus/suites/r/lib/gate.sh, Windows host, 2026-09-23"

[provenance]
donor       = "claudette-cards"
imported_at = "2026-09-23"
verbatim    = []
rewritten   = ["prompt", "refsol"]
synthesized = ["id", "title", "lang", "kind", "timeout_s", "turn", "fixture", "verify", "sham", "variants", "disposition", "selection", "gate", "donor_tags"]

caveats = [
  """
  THE PROMPT comes from research/patches/SEC-06-task-prompt-h1.txt. Two subject-neutral edits, nothing else: the read_file range sentence names no parameters (abcc says from_line/to_line, claudette says offset/limit).\
  """,

  """
  THE REFSOL is research/patches/SEC-06-reference-solution.patch. It carries the card author's own test in `mod tests`; the verifier's hidden module is separate and does not depend on it. REWRITTEN BY `cargo fmt` and nothing else: the card's patch failed its own fmt rung (a one-line `assert!` over the width, and a blank line before the closing brace of `mod tests`), measured by gate point 2 on 2026-09-23. A refsol that cannot land cannot show the verifier accepts a correct answer.\
  """,

  """
  THE HIDDEN TEST is the card author's red test (hidden.rs), appended by the verifier as its own `#[cfg(test)] mod w8_hidden` at the end of the target file. The subject never sees it and its own test never decides the verdict (F832).\
  """,
]

[donor_tags]
card   = "SEC-06"
target = "crates/claudette/src/tools/semantic.rs"
