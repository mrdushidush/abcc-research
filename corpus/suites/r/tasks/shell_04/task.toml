  """,
  """
  A CLAUDETTE TEST RACES ON THIS TASK. With the refsol applied, `tools::tests::list_dir_classifies_file_and_subdir_correctly`   failed 4 of 4 parallel runs on "path is outside $HOME (…claudette-temphome-…)": another test's temporary $HOME   leaking into it. It passes alone. The verifier re-runs a failing OTHER test once, serially, and reports   `others=flaky` by name; the hidden test is never retried. A subject's tree can trip the same race, so read   `others=flaky` as this, not as a regression  """,

