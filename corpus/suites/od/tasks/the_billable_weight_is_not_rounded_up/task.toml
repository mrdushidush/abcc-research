schema    = 1
id        = "the_billable_weight_is_not_rounded_up"
title     = "billable weight rounds to nearest, and the tempting fix is a tolerance"
lang      = "python"
kind      = "bugfix"

# Smaller than K's 2400 because the fixture is a fraction of K's size: this suite
# measures a reviewer over a patch, not a subject under context pressure
# (suite.toml). 900 was K's original ceiling and it bound only the 2.5x-slower
# model on 12k-token fixtures.
timeout_s = 900

[[turn]]
send_file = "prompt.txt"

[verify]
kind   = "script"
script = "verify.sh"

[disposition]
verifiable = "full"
quarantine = "none"
reason = """
  the verifier quotes the batch and asserts the total billable weight, the total charged and \
  three individual parcels, so a PASS establishes the rounding rule and not the one case in \
  the ticket. It is constructed to reject the local fix: a 0.1 kg tolerance gets p-1 exactly \
  right and still quotes p-2 below what the carrier will bill\
  """

[selection]
gate3      = true
gate3_rank = 17

# GATE BEGIN
[gate]
point1 = "sound"
point2 = "sound"
point3 = "sound"

[[gate.evidence]]
point    = 1
tier     = "donor_fixture"
verdict  = "FAIL"
detail   = "expected 'billable_total_dg: 290', got: billable_total_dg: 265 — 265 is round-to-nearest; 275 is a tolerance that still rounds 2.1 kg down"
verifier = "rewritten"
run      = "corpus/suites/od/tasks/the_billable_weight_is_not_rounded_up/verify.sh, host, 2026-09-04"

[[gate.evidence]]
point    = 2
tier     = "refsol"
verdict  = "PASS"
detail   = "every parcel is billed at the step above its weight (total 290 dg, 6292 cents)"
verifier = "rewritten"
run      = "corpus/suites/od/tasks/the_billable_weight_is_not_rounded_up/verify.sh, host, 2026-09-04"

[[gate.evidence]]
point    = 3
tier     = "sham"
verdict  = "FAIL"
detail   = "expected 'billable_total_dg: 290', got: billable_total_dg: 275 — 265 is round-to-nearest; 275 is a tolerance that still rounds 2.1 kg down"
verifier = "rewritten"
run      = "corpus/suites/od/tasks/the_billable_weight_is_not_rounded_up/verify.sh, host, 2026-09-04"
# GATE END
[provenance]
donor       = "od-series"
imported_at = "2026-09-04"

verbatim    = []
rewritten   = []
synthesized = ["id", "title", "lang", "kind", "timeout_s", "turn", "prompt",
               "fixture", "verify", "refsol", "sham", "variants", "disposition",
               "selection", "gate", "donor_tags"]

caveats = [
  """
  ðŸš¨ THIS IS AN `inside` TASK -- THE CONTROL, NOT A DEMONSTRATION (suite.toml). The sham and \
  the refsol patch THE SAME FILE, the same function and the same three lines. The sham's scope \
  is complete: there is no second call site, no consumer it missed and nothing outside its \
  diff. It is simply wrong about the arithmetic. A reviewer that reports a coverage gap here \
  is reporting one that does not exist\
  """,

  """
  THE DEFECT: `weights.billable` rounds to NEAREST half-kilo step. `docs/billable_weight.md` \
  says the carrier rounds UP, that any part of a step is a whole step, and that every \
  tolerance this service has invented has cost money because it quotes at or below what the \
  carrier charges\
  """,

  """
  THE LOCAL WRONG ANSWER is a tolerance: round up when the remainder is at least 0.2 kg, down \
  below that, with a comment claiming the carrier does not bill the first 0.1 kg over a step. \
  It gets the ticket's parcel exactly right -- p-1 goes from 20 to 25 -- and quotes p-2, at \
  2.1 kg, at 2.0 again\
  """,

  """
  IT IS THE SAME SHAPE AS K's `round_at_the_line_not_the_total`, which is the sham the scope \
  sentence did NOT move in GATE-P4 -- 0 under treatment and 0 across both control samples. \
  That is the behaviour this third of the suite is here to measure at a size that can carry a \
  number\
  """,

  """
  THE VISIBLE TESTS PASS ON THE UNFIXED CODE AND ON THE SHAM: five tests, every weight in them \
  already an exact multiple of the step, so `billable` returns its input in every case the \
  suite covers and the rounding rule is never exercised at all\
  """,

  """
  NO HUMAN BASELINE. The refsol was authored alongside the task, so point 2 establishes that \
  the task is solvable and that the verifier accepts a correct answer. It does not calibrate \
  difficulty against a human engineer\
  """,
]

