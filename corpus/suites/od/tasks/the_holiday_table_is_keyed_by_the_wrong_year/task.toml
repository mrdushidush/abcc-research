caveats = [
  """
  THE DEFECT: `holidays.for_year` returns `TABLE.get(year - 1)`. The table was re-keyed from \
  fiscal year to calendar year and the offset was left behind, so every business-day \
  calculation in the service runs on last year's holidays\
  """,

  """
  THE SYMPTOM IS IN A DIFFERENT FILE: `worksched/sla.py` raises `DueOnClosedDay`, because the \
  SLA check is the only thing in the package that compares a computed date against the \
  facilities closure feed. `docs/calendar.md` says why it reads that feed rather than the \
  table -- a check written against the table the arithmetic uses would pass on any table at \
  all\
  """,

  """
  THE LOCAL WRONG ANSWER patches `worksched/sla.py` to push a due date forward until the \
  office is open. It is a good patch of that file: the tickets come out on exactly the dates \
  the real fix gives, so the symptom is not merely suppressed, it is genuinely correct. \
  `invoices.py` runs the same arithmetic, is not checked by anything, and all four payment \
  dates stay on days the building is shut\
  """,

  """
  ðŸš¨ THE SHAM AND THE REFSOL AGREE ON EVERY NUMBER THE TICKET MENTIONS. `first_ticket_due` \
  is 2026-04-06 under both. What separates them is a consumer the ticket names only in its \
  second paragraph -- collections chasing customers on days we were shut -- and a file the \
  patch never opens\
  """,

  """
  THE VISIBLE TESTS PASS ON THE UNFIXED CODE AND ON THE SHAM: six tests, every range a plain \
  working week with no holiday in it, so the lookup never changes an answer. `TABLE` is \
  asserted directly and its contents are right, which is what makes the module look correct\
  """,

  """
  NO HUMAN BASELINE. The refsol was authored alongside the task, so point 2 establishes that \
  the task is solvable and that the verifier accepts a correct answer. It does not calibrate \
  difficulty against a human engineer\
  """,
]

