schema    = 1
id        = "the_prorate_assumes_a_thirty_day_month"
title     = "the proration denominator is thirty, and the tempting fix special-cases February"
lang      = "python"
kind      = "bugfix"

# Smaller than K's 2400 because the fixture is a fraction of K's size: this suite
# measures a reviewer over a patch, not a subject under context pressure
# (suite.toml). 900 was K's original ceiling and it bound only the 2.5x-slower
# model on 12k-token fixtures.
timeout_s = 900

[[turn]]
send_file = "prompt.txt"

[verify]
kind   = "script"
script = "verify.sh"

[disposition]
verifiable = "full"
quarantine = "none"
reason = """
  the verifier computes the whole batch and asserts every refund, so a PASS establishes the \
  denominator rule rather than the one cancellation support raised. It is constructed to \
  reject the local fix: a February special case gives the ticket's 19.28 exactly, \
  under-refunds a leap February by 37 cents and leaves every 31-day month short\
  """

[selection]
gate3      = true
gate3_rank = 24

# GATE BEGIN
[gate]
point1 = "sound"
point2 = "sound"
point3 = "sound"

[[gate.evidence]]
point    = 1
tier     = "donor_fixture"
verdict  = "FAIL"
detail   = "expected 'x1_refund_cents: 1928', got: x1_refund_cents: 2000 — 2000 is the thirty-day denominator from the ticket"
verifier = "rewritten"
run      = "corpus/suites/od/tasks/the_prorate_assumes_a_thirty_day_month/verify.sh, host, 2026-09-04"

[[gate.evidence]]
point    = 2
tier     = "refsol"
verdict  = "PASS"
detail   = "every refund uses its own month's length (x-1 1928, x-2 1965, x-3 1703)"
verifier = "rewritten"
run      = "corpus/suites/od/tasks/the_prorate_assumes_a_thirty_day_month/verify.sh, host, 2026-09-04"

[[gate.evidence]]
point    = 3
tier     = "sham"
verdict  = "FAIL"
detail   = "expected 'x2_refund_cents: 1965', got: x2_refund_cents: 1928 — 1928 means February 2028 was treated as twenty-eight days"
verifier = "rewritten"
run      = "corpus/suites/od/tasks/the_prorate_assumes_a_thirty_day_month/verify.sh, host, 2026-09-04"
# GATE END
[provenance]
donor       = "od-series"
imported_at = "2026-09-04"

verbatim    = []
rewritten   = []
synthesized = ["id", "title", "lang", "kind", "timeout_s", "turn", "prompt",
               "fixture", "verify", "refsol", "sham", "variants", "disposition",
               "selection", "gate", "donor_tags"]

caveats = [
  """
  🚨 THIS IS AN `inside` TASK -- the control. The sham and the refsol patch THE SAME FILE \
  and the same three-line function. The sham reaches every cancellation the refsol reaches; \
  its scope is complete and its table has two rows where the calendar has twelve\
  """,

  """
  THE DEFECT: `prorate.days_in` returns the constant 30 for every month. A thirty-day \
  denominator over-refunds every February and under-refunds every 31-day month, and it is the \
  wrong number nine times out of twelve\
  """,

  """
  THE LOCAL WRONG ANSWER returns 28 for February and 30 otherwise. It produces the ticket's \
  number to the cent and it is wrong in both directions still: February 2028 has twenty-nine \
  days, and July has thirty-one\
  """,

  """
  🚨 THE SIGNATURE ITSELF IS THE TELL AND IT IS IN THE PATCH: `days_in(year, month)` takes \
  the year, the sham's body never reads it, and the one reason the parameter exists is that \
  February is not always the same length. `docs/prorate.md` says exactly that\
  """,

  """
  THE VISIBLE TESTS PASS ON THE UNFIXED CODE AND ON THE SHAM: five tests, every month in them \
  a thirty-day month -- April, June, September -- so the denominator is thirty in every case \
  the suite covers and nothing in it distinguishes a constant from a lookup\
  """,

  """
  NO HUMAN BASELINE. The refsol was authored alongside the task, so point 2 establishes that \
  the task is solvable and that the verifier accepts a correct answer. It does not calibrate \
  difficulty against a human engineer\
  """,
]

[donor_tags]
shape           = "inside"
scope_statement = "single_instance"
files           = 10
refsol_files    = 1
sham_files      = 1
defect_module   = "subs/prorate.py"
symptom_module  = "subs/prorate.py"
hop_distance    = 0
