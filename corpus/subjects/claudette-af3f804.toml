schema  = 1
id      = "claudette-af3f804"
title   = "Claudette v0.17.0 + multi-line delivery — the stand-in subject"
version = "0.17.0"
commit  = "af3f804"
bin     = "claudette"
args    = []                    # no arguments = REPL
drive   = "repl-pipe"

# The same subject as `claudette-fc1ea22`, one commit later, and the commit is the whole point:
# `af3f804` adds the piped REPL's sentinel block. Before it, 69 of the 90 U100 prompts could not be
# delivered as one turn by ANY path, so `--delivery verbatim` refused 207 of 271 cells. Both
# descriptors are kept: fc1ea22 is what the first measured numbers were taken against, and a
# baseline whose subject id no longer resolves is not a baseline.
#
# NOT one-shot. run.rs:186 constructs `let mut no_prompter: Option<&mut dyn PermissionPrompter>
# = None`, so one-shot cannot answer a gate and therefore cannot edit a file at all without
# CLAUDETTE_AUTO_APPROVE. Only the REPL builds a prompter (run/repl.rs:56, passed as Some on
# every turn at :169-170). F1.

# A baseline, not a proxy: the same harness produces the before and the after.

capabilities = ["tool_gate", "redirect", "undo", "resume"]
# Absent, deliberately: "pause". There is no SIGINT handler for a running turn; ctrl_c only
# cancels an input line (run/line_editor.rs:663). The gate is the only synchronous
# interception point, so it stops the agent only when a tool happens to need permission.
#
# R6 was approved on the understanding that this vocabulary is a prediction about a 2.0 that
# does not exist yet, and will need one revision when 2.0 first runs.

[env]
NO_COLOR                    = "1"
CLAUDETTE_OPENAI_COMPAT     = "1"
CLAUDETTE_SKIP_OLLAMA_PROBE = "1"
# CLAUDETTE_AUTO_APPROVE is deliberately unset. Setting it is what blinded Q56.

[markers]
gate     = "Allow? [y/N"                              # stderr, and it has NO trailing newline
# Four capture groups: iterations, in, out, and the context estimate. The fourth is OPTIONAL in
# the loader (`compile_turn_end`) and is declared here because it is the only thing on the wire
# that can answer "how full did the window actually get" — the first three are session-cumulative,
# so 317,865 tokens over 22 iterations reads the same whether the session sat at 14k or climbed
# past 30k. It feeds `peak_prompt_tokens`, which the K-series needs as a validity gate.
#
# The line is `⚡ turn iter=22 in=317865 out=27734 ctx ~14k/39k (36%)` (repl.rs:205-214, gauge at
# run/cli_prompter.rs:26-38). `.*?` rather than a literal space so an ANSI colour reset between
# the fields cannot break the match. `(\d+k?)` because the gauge humanizes: below 1024 it prints
# the raw count, above it prints round(n/1024) with a `k` — and ⚠ that `k` is 1024, not 1000.
turn_end = '^⚡ turn iter=(\d+) in=(\d+) out=(\d+).*?ctx ~(\d+k?)/'   # stderr, repl.rs:205-214

[delivery]
# SPEC §7, amendment 7. A line equal to `open` starts a block; a line equal to `close` ends it;
# everything between arrives as one turn with its newlines and blank lines intact. Both must be
# alone on their line and match exactly. Hyphenated rather than underscored because Claudette's
# own doc-drift guard scans `src/` for `CLAUDETTE_` followed by capitals and would read an
# underscored sentinel as an undocumented env var.
open  = "<<<CLAUDETTE-PROMPT"
close = "CLAUDETTE-PROMPT>>>"

[quirks]
# Things the adapter must handle that a reading of the docs would have got wrong.
gate_has_no_trailing_newline = true   # write!, not writeln!, cli_prompter.rs:84
usage_is_session_cumulative  = true   # UsageTracker::record only ever +=, usage.rs:44-50
usage_seeded_from_session    = true   # conversation.rs:287 — sessions must start fresh
non_ascii_under_no_color     = true   # NO_COLOR strips ANSI, not glyphs; readers must be UTF-8
prompt_never_echoed_on_pipe  = true   # line_editor.rs ignores the prompt argument when piped
block_is_trimmed_as_a_whole  = true   # the REPL trims the assembled block (repl.rs:124), so
                                      # leading/trailing blank lines of a prompt do not survive.
                                      # Interior ones do, which is what the dictated code bodies
                                      # need (F25).
