[package]
name = "w3-runtime-probe"
version = "0.1.0"
edition = "2021"

# Deliberately the SAME dependency line Claudette ships
# (crates/claudette/Cargo.toml:57) — the point of the probe is what the
# engine being copied already has, not what a fresh crate could pick.
[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[[bin]]
name = "probe"
path = "src/main.rs"
