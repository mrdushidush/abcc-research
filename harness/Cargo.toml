[workspace]
resolver = "3"
members = [
    "crates/w8-import",
    "crates/w8-corpus",
    "crates/w8-run",
    "crates/w8-import-q56",
    "crates/hw-probe",
]

# W8's harness. Step 2 of the plan is `w8-import`; step 3 is `w8-corpus` and the runner, which
# is why this is a workspace from the start rather than a single crate to be converted.
#
# `w8-import` has zero third-party dependencies and should keep them: it parses one JavaScript
# file, writes TOML whose comment layout it has to control anyway, and shells out to bash. A
# `toml` *serializer* would strip the comments that carry the findings, and the comments are half
# the point of the format (SPEC.md §2).
#
# `w8-corpus` takes `toml` as the workspace's first third-party dependency — for *parsing* only,
# which is the direction the paragraph above never objected to, and which SPEC.md §2 anticipated
# when it chose TOML on the grounds that `toml` is already a Claudette dependency.
#
# `w8-run` adds `regex`, and only because the subject descriptor declares its turn-end marker as a
# regex with capture groups (SPEC.md §7). Hand-parsing it would make the corpus declare one thing
# and the runner do another. It talks to the model endpoint over a hand-rolled HTTP/1.1 client
# (`src/endpoint.rs`) rather than taking an HTTP dependency: the endpoint is plain-text localhost,
# so there is no TLS to get wrong and ~90 lines cover it.
#
# `hw-probe` is the first crate here that is not W8's, which is why it is not named `w8-*`. It
# belongs to brief §14 item 2 (W1 + W2) and is the instrument those two owe every measured claim
# to — the concurrency ceiling, KV growth under residency, model-swap cost — but W6 needs it too,
# for whether a second model can sit beside the champion's 13.6 GB. Naming it for one workstream
# would misdescribe it by the time it is first reused. It adds no dependency and no `unsafe`.

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[profile.release]
debug = 1
